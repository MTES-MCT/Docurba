{% extends 'admin/change_form.html' %}

{% block submit_buttons_bottom %}
    {% if perms.core.change_event %}
        <div class="submit-row">
            {% if original.is_archived %}
            <input type="submit" value="Désarchiver" name="_unarchive">
            {% else %}
            <input type="submit" value="Archiver" name="_archive">
            {% endif %}
        </div>
    {% endif %}
    {{ block.super }}
{% endblock %}
